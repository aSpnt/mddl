wiremock.server.url: 'http://localhost:${wiremock.server.port}'
spring:
  datasource:
    url: jdbc:postgresql://${embedded.postgresql.host}:${embedded.postgresql.port}/${embedded.postgresql.schema}
    username: ${embedded.postgresql.user}
    password: ${embedded.postgresql.password}
  flyway:
    locations: filesystem:flyway/migrations
    baseline-on-migrate: true
logging:
  level:
    WireMock: WARN
    org.springframework.jdbc.core: WARN
